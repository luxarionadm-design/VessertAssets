<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="m-v-left" x1="20" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="m-v-right" x1="100" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="m-v-facet" x1="60" y1="35" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="m-glow" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="m-shadow" x="0" y="0" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="30" fill="#0F172A"/>
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#m-glow)"/>
  <rect x="6" y="6" width="108" height="108" rx="30" stroke="#334155" stroke-width="1.5"/>

  <!-- Isometric Faceted V Monogram -->
  <g filter="url(#m-shadow)">
    <!-- Left Wing -->
    <path d="M28 30 L52 30 L60 78 L42 88 Z" fill="url(#m-v-left)"/>
    <!-- Right Wing -->
    <path d="M92 30 L68 30 L60 78 L78 88 Z" fill="url(#m-v-right)"/>
    <!-- Central Facet -->
    <polygon points="60,38 72,68 60,90 48,68" fill="url(#m-v-facet)"/>
    <polygon points="60,38 60,90 48,68" fill="#6366F1" opacity="0.6"/>
    <!-- Highlights -->
    <line x1="28" y1="30" x2="52" y2="30" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="30" x2="92" y2="30" stroke="#CFFAFE" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="38" r="3" fill="#FFFFFF"/>
  </g>
</svg>
