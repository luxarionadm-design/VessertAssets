<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="v-left" x1="20" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="v-right" x1="100" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="v-facet" x1="60" y1="35" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="140" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 3D Monogram Container -->
  <g filter="url(#shadow)">
    <!-- Ambient Glow Backplate -->
    <rect x="8" y="8" width="104" height="104" rx="28" fill="#0F172A"/>
    <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#glow)"/>
    <rect x="8" y="8" width="104" height="104" rx="28" stroke="#334155" stroke-width="1.5"/>

    <!-- Isometric Faceted V Crest -->
    <!-- Left Wing -->
    <path d="M30 32 L52 32 L60 76 L44 86 Z" fill="url(#v-left)"/>
    <!-- Right Wing -->
    <path d="M90 32 L68 32 L60 76 L76 86 Z" fill="url(#v-right)"/>
    <!-- Central Core Jewel / Facet -->
    <polygon points="60,40 70,68 60,88 50,68" fill="url(#v-facet)"/>
    <polygon points="60,40 60,88 50,68" fill="#6366F1" opacity="0.6"/>
    <!-- Specular Edge Accents -->
    <line x1="30" y1="32" x2="52" y2="32" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="68" y1="32" x2="90" y2="32" stroke="#CFFAFE" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="40" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography Brand Identity -->
  <g transform="translate(132, 28)">
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5" fill="#0F172A">
      VESSERT
    </text>
    <!-- Accent ID Badge -->
    <rect x="228" y="8" width="68" height="48" rx="12" fill="#06B6D4"/>
    <text x="262" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF" text-anchor="middle">
      ID
    </text>
    <!-- Subtitle Meta Tag -->
    <text x="2" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#64748B">
      SPATIAL 3D &amp; CREATIVE ENGINE
    </text>
  </g>
</svg>
