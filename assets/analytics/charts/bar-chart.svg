<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" fill="none">
  <defs>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="16" fill="#0F172A"/>
  <rect width="640" height="280" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Creator Engagement Activity (Reels &amp; 3D Views)</text>

  <!-- Horizontal Gridlines -->
  <line x1="60" y1="80" x2="580" y2="80" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="60" y1="130" x2="580" y2="130" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="60" y1="180" x2="580" y2="180" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="60" y1="220" x2="580" y2="220" stroke="#475569" stroke-width="1.5"/>

  <!-- Bars -->
  <g transform="translate(0, 0)">
    <!-- Bar 1 -->
    <rect x="90" y="140" width="36" height="80" rx="6" fill="url(#bar-grad)"/>
    <text x="108" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Jan</text>
    <!-- Bar 2 -->
    <rect x="170" y="110" width="36" height="110" rx="6" fill="url(#bar-grad)"/>
    <text x="188" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Feb</text>
    <!-- Bar 3 -->
    <rect x="250" y="80" width="36" height="140" rx="6" fill="url(#bar-grad)"/>
    <text x="268" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Mar</text>
    <!-- Bar 4 -->
    <rect x="330" y="120" width="36" height="100" rx="6" fill="url(#bar-grad)"/>
    <text x="348" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Apr</text>
    <!-- Bar 5 -->
    <rect x="410" y="60" width="36" height="160" rx="6" fill="url(#bar-grad)"/>
    <text x="428" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">May</text>
    <!-- Bar 6 -->
    <rect x="490" y="45" width="36" height="175" rx="6" fill="#06B6D4"/>
    <text x="508" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#38BDF8" font-weight="700" text-anchor="middle">Jun</text>
  </g>
</svg>
