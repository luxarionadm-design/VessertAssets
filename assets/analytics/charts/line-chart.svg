<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" fill="none">
  <defs>
    <linearGradient id="chart-area" x1="0" y1="40" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chart-line" x1="60" y1="0" x2="580" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="280" rx="16" fill="#0F172A"/>
  <rect width="640" height="280" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Chart Header -->
  <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Daily Render Volume Growth</text>
  <text x="32" y="56" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#38BDF8">148,250 <tspan font-size="12" font-weight="700" fill="#10B981">+24.8% MoM</tspan></text>

  <!-- Gridlines -->
  <line x1="60" y1="100" x2="580" y2="100" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="60" y1="140" x2="580" y2="140" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="60" y1="180" x2="580" y2="180" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="60" y1="220" x2="580" y2="220" stroke="#475569" stroke-width="1.5"/>

  <!-- Area Fill -->
  <path d="M60 220 L60 190 Q120 160 180 170 T300 130 T420 110 T540 80 L580 70 L580 220 Z" fill="url(#chart-area)"/>

  <!-- Line -->
  <path d="M60 190 Q120 160 180 170 T300 130 T420 110 T540 80 L580 70" stroke="url(#chart-line)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Data Points -->
  <circle cx="60" cy="190" r="4.5" fill="#818CF8" stroke="#0F172A" stroke-width="2"/>
  <circle cx="180" cy="170" r="4.5" fill="#6366F1" stroke="#0F172A" stroke-width="2"/>
  <circle cx="300" cy="130" r="4.5" fill="#4F46E5" stroke="#0F172A" stroke-width="2"/>
  <circle cx="420" cy="110" r="4.5" fill="#0EA5E9" stroke="#0F172A" stroke-width="2"/>
  <circle cx="540" cy="80" r="4.5" fill="#06B6D4" stroke="#0F172A" stroke-width="2"/>
  <circle cx="580" cy="70" r="5.5" fill="#22D3EE" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- X-Axis Labels -->
  <text x="60" y="242" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Mon</text>
  <text x="180" y="242" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Tue</text>
  <text x="300" y="242" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Wed</text>
  <text x="420" y="242" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Thu</text>
  <text x="540" y="242" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Fri</text>
  <text x="580" y="242" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Sat</text>
</svg>
