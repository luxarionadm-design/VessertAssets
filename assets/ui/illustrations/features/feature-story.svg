<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" rx="16" fill="#0F172A"/>
  <!-- Phone Frame Mockup -->
  <rect x="140" y="30" width="120" height="220" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <!-- Story Ring Avatar -->
  <circle cx="200" cy="90" r="30" stroke="url(#story-grad)" stroke-width="3"/>
  <circle cx="200" cy="90" r="24" fill="#6366F1"/>
  <!-- Story Bars -->
  <rect x="150" y="42" width="22" height="3" rx="1.5" fill="#FFF"/>
  <rect x="176" y="42" width="22" height="3" rx="1.5" fill="#FFF"/>
  <rect x="202" y="42" width="22" height="3" rx="1.5" fill="#64748B"/>
  <rect x="228" y="42" width="22" height="3" rx="1.5" fill="#64748B"/>
  <text x="200" y="275" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFF" text-anchor="middle">24-Hour Spatial Stories</text>
  <defs>
    <linearGradient id="story-grad" x1="170" y1="60" x2="230" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/><stop offset="50%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>