<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" fill="none">
  <rect width="480" height="320" rx="16" fill="#0F172A"/>
  <!-- Hourglass -->
  <polygon points="200,60 280,60 240,110" fill="#F59E0B" stroke="#D97706" stroke-width="3"/>
  <polygon points="200,160 280,160 240,110" fill="#F59E0B" stroke="#D97706" stroke-width="3"/>
  <line x1="190" y1="60" x2="290" y2="60" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="160" x2="290" y2="160" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <text x="240" y="215" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#F59E0B" text-anchor="middle">GATEWAY TIMEOUT</text>
  <text x="240" y="250" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Render Connection Timed Out</text>
  <text x="240" y="275" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">The server took too long to respond to your request.</text>
